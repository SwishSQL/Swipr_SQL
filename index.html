
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swipr - Staff Scheduling</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#2563EB" />
    <!-- Without a manifest, "add to home screen" produced a plain shortcut
         rather than an installed app, which is part of why sessions did not
         survive being reopened on a phone. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Swipr" />
    <script>
      try { if (localStorage.getItem('swipr_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <!-- Swipr <-> Quality switch animation; must run before first paint (see public/system-warp.js) -->
    <script src="/system-warp.js?v=6"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
    </style>
</head>
  <body class="bg-[#F8FAFC] text-[#1E293B]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
